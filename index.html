<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MurzyWorld</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: white;
        min-height: 100vh;
        background: linear-gradient(270deg, #ff0000, #ff7a00, #ffd500, #3cff00, #00ffd5, #0040ff, #b300ff);
        background-size: 1400% 1400%;
        animation: rainbowBG 18s ease infinite;
    }

    @keyframes rainbowBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Header */
    .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 25px;
        background: rgba(20, 20, 20, 0.5);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(255,255,255,0.15);
        z-index: 9999; /* теперь всегда поверх */
    }

    .title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .right {
        display: flex;
        align-items: center;
        gap: 15px;
        font-size: 14px;
    }

    .ip {
        opacity: 0.85;
    }

    .copy-btn {
        background: #ffcc00;
        border: none;
        padding: 6px 12px;
        cursor: pointer;
        font-weight: bold;
        border-radius: 6px;
    }

    /* Content */
    .container {
        padding: 120px 20px 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }

    .card {
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        transition: 0.3s;
        backdrop-filter: blur(6px);
    }

    .card:hover {
        transform: translateY(-5px);
        background: rgba(0,0,0,0.5);
    }

    .rank {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .btn {
        margin-top: 15px;
        background: #ffcc00;
        border: none;
        padding: 10px 15px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        width: 100%;
    }

    /* YT стиль */
    .yt {
        font-size: 20px;
        font-weight: bold;
    }

    .yt .y {
        color: #ff0000;
    }

    .yt .t {
        color: #ffffff;
    }

</style>
</head>
<body>

<div class="header">
    <div class="title">MurzyWorld</div>
    <div class="right">
        <div class="ip">IP: murzyworld.play.hosting</div>
        <button class="copy-btn" onclick="copyIP()">Copy IP</button>
    </div>
</div>

<div class="container">

    <div class="card">
        <div class="rank" style="color:#7f7f7f">PLAYER</div>
        <button class="btn">Податься</button>
    </div>

    <div class="card">
        <div class="rank" style="color:#ffcc00">VIP</div>
        <button class="btn">Податься</button>
    </div>

    <div class="card">
        <div class="rank" style="color:#0066ff">MEGA</div>
        <button class="btn">Податься</button>
    </div>

    <div class="card">
        <div class="rank" style="color:#00cc66">MURZER</div>
        <button class="btn">Податься</button>
    </div>

    <div class="card">
        <div class="rank" style="color:#66ccff">MODER</div>
        <button class="btn">Податься</button>
    </div>

    <!-- Новый донат YT -->
    <div class="card">
        <div class="yt"><span class="y">Y</span><span class="t">T</span></div>
        <button class="btn">Податься</button>
    </div>

</div>

<script>
function copyIP() {
    navigator.clipboard.writeText("murzyworld.play.hosting");
    alert("IP скопирован!");
}
</script>

</body>
</html>
